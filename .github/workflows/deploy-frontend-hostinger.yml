name: Deploy Frontend to Hostinger

on:
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build and deploy frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to Hostinger website
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_FRONTEND_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_FRONTEND_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_FRONTEND_USER }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_FRONTEND_PORT }}
          SOURCE: frontend/dist/
          TARGET: ${{ secrets.HOSTINGER_FRONTEND_PATH }}
          ARGS: -az --delete --exclude .htaccess
