name: Deploy Backend to Hostinger

on:
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy backend to Hostinger VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_BACKEND_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_BACKEND_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_BACKEND_USER }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_BACKEND_PORT }}
          SOURCE: backend/
          TARGET: ${{ secrets.HOSTINGER_BACKEND_PATH }}
          ARGS: -az --delete
          EXCLUDE: "node_modules/, .env, src/generated/prisma/"
          SCRIPT_AFTER: |
            set -eu

            . ~/.nvm/nvm.sh
            nvm install 24
            nvm use 24
  
            cd "${{ secrets.HOSTINGER_BACKEND_PATH }}"
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            pm2 restart mini-business-backend || pm2 start npm --name mini-business-backend -- start
            pm2 save
