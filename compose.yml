services:
  postgres:
    image: postgres:16
    container_name: mini-business-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: mini_business_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_business_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
